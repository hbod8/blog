name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.165.0

# Build check only. The archive photos aren't in git, so deploys run locally
# (see terraform/TERRAFORM.md).
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo
        run: |
          mkdir -p "$RUNNER_TEMP/hugo"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Show Hugo version
        run: hugo version

      # The `assets` symlink points at a local drive.
      - name: Stub out local-only assets
        run: rm assets && mkdir assets

      - name: Build site
        run: hugo --minify
