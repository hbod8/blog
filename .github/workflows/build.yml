name: Build

on:
  # Merge check - the `build` job is the required status check on main.
  pull_request:
    branches: [main]
  # Every PR merge.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.165.0

# Build check only - there is no deploy step. The archive photos live on a
# local drive (the `assets` symlink), not in git, so a runner can't produce
# the real site. Templates and content still build without them
# (resources.Get just returns nil for the missing images), which is enough to
# catch broken layouts and front matter before merge. Deploys are run locally
# with `hugo deploy`; see terraform/TERRAFORM.md.
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # `extended` matches the local Homebrew toolchain. The withdeploy
      # variant isn't needed since nothing is deployed from here.
      - name: Install Hugo
        run: |
          mkdir -p "$RUNNER_TEMP/hugo"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Show Hugo version
        run: hugo version

      # The checked-out `assets` symlink dangles on the runner; replace it
      # with an empty directory so Hugo treats it as an ordinary empty assets
      # dir.
      - name: Stub out local-only assets
        run: rm assets && mkdir assets

      - name: Build site
        run: hugo --minify
