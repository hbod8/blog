<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      {{ block "title" . }}
        {{ .Site.Title }}
      {{ end }}
    </title>
    <!-- CSS only -->
    <link rel="stylesheet" href="{{ "stylesheet.css" | relURL }}">
    <link rel="shortcut icon" href="{{ "favicon.ico" | relURL }}" type="image/png">
    <!-- JavaScript -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/exifr"></script> -->
    <script src="{{ "script.js" | relURL }}" defer></script>
    {{ template "_internal/opengraph.html" . }}
    {{ template "_internal/google_analytics.html" . }}
  </head>
  <body>
    <main>
      {{ block "main" . }}
      {{ end }}
    </main>
    {{ partial "footer.html" }}
  </body>
</html>
